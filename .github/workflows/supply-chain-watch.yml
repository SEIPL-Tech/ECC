name: Supply-Chain Watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/supply-chain-watch.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'scripts/ci/*supply-chain*.js'
      - 'scripts/ci/validate-workflow-security.js'
      - 'tests/ci/*supply-chain*.test.js'
      - 'tests/ci/validate-workflow-security.test.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ioc-watch:
    name: IOC watch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'

      - name: Install dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts

      # Explicit status conditions keep independent checks running after a failure.
      # No continue-on-error: any failed check still fails the job.
      - name: Verify registry signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit signatures

      - name: Check production advisories
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Validate IOC scanner fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tests/ci/scan-supply-chain-iocs.test.js

      - name: Validate advisory source fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tests/ci/supply-chain-advisory-sources.test.js

      - name: Generate IOC report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          node scripts/ci/scan-supply-chain-iocs.js --json > artifacts/supply-chain-ioc-report.json

      - name: Generate advisory source report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          node scripts/ci/supply-chain-advisory-sources.js --refresh --json > artifacts/supply-chain-advisory-sources.json

      - name: Validate workflow hardening rules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/validate-workflow-security.js

      - name: Upload IOC report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-ioc-report
          path: |
            artifacts/supply-chain-ioc-report.json
            artifacts/supply-chain-advisory-sources.json
          retention-days: 14
          if-no-files-found: error
